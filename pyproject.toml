[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-rsi"
version = "0.1.0"
description = "A measured robot decision learning loop with a live training dashboard"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.11"]

[project.scripts]
embodied-rsi = "embodied_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embodied_rsi = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

